name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 目标运行环境是 Ubuntu（板卡为 Ubuntu 22.04 aarch64），作为必过项
          - os: ubuntu-24.04
            blocking: true
          # GitHub 的 Windows runner 没有音频设备与传感器，
          # 涉及语音/硬件枚举的用例在云端不可靠，因此记为“允许失败”
          - os: windows-latest
            blocking: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q edge_agent

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Mock backend smoke test
        run: python -m edge_agent --config config/mock.json demo
