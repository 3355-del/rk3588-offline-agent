name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q edge_agent

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Mock backend smoke test
        run: python -m edge_agent --config config/mock.json demo
