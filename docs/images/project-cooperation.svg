<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">检测告警 × 离线助手：两个项目如何协作</title><desc id="desc">一个产生结构化事件，一个读取事件并辅助查询；同板卡需配置路径与运行模式</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#197d73"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f5f7fa"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" fill="#172c43"><rect x="44" y="40" width="7" height="56" rx="3" fill="#197d73"/><text x="70" y="66" font-size="30" font-weight="700">检测告警 × 离线助手：两个项目如何协作</text><text x="70" y="99" font-size="18" fill="#52657a">一个产生结构化事件，一个读取事件并辅助查询；同板卡需配置路径与运行模式</text><rect x="44" y="150" width="480" height="155" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="150" width="5" height="155" rx="2" fill="#197d73"/><text x="66" y="188" font-size="24" font-weight="700">项目一 · 多路检测告警</text><text x="66" y="223" font-size="19" fill="#52657a">视频 → 检测 → 区域与冷却判断</text><text x="66" y="252" font-size="19" fill="#52657a">本地截图 + 事件投递（reliable 模式）</text><rect x="676" y="150" width="480" height="155" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="676" y="150" width="5" height="155" rx="2" fill="#197d73"/><text x="698" y="188" font-size="24" font-weight="700">项目二 · 离线多模态助手</text><text x="698" y="223" font-size="19" fill="#52657a">文字 / 图片 / 语音交互</text><text x="698" y="252" font-size="19" fill="#52657a">通过受控工具查询告警与截图</text><rect x="44" y="365" width="480" height="130" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="365" width="5" height="130" rx="2" fill="#197d73"/><text x="66" y="403" font-size="24" font-weight="700">SQLite 告警库</text><text x="66" y="438" font-size="19" fill="#52657a">接收端提交后 ACK；event_id 去重</text><rect x="676" y="365" width="480" height="130" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="676" y="365" width="5" height="130" rx="2" fill="#197d73"/><text x="698" y="403" font-size="24" font-weight="700">本地截图目录</text><text x="698" y="438" font-size="19" fill="#52657a">按事件关联文件名；限制目录与大小</text><path d="M284 305V365" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M524 240H600V345H916V365" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M676 260H600V430H524" fill="none" stroke="#197d73" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M916 305V365" fill="none" stroke="#197d73" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="44" y="548" width="1112" height="105" rx="12" fill="#e5f1ef"/><text x="68" y="584" font-size="23" font-weight="700">同板卡运行：遵守 NPU 会话租约</text><text x="68" y="619" font-size="20">避免已知 NPU 冲突；共存方案可让检测使用 NPU、助手使用 CPU，并另做部署验收。</text><text x="44" y="689" font-size="18" fill="#52657a">实线：数据写入；虚线：助手读取。截图不通过告警 TCP 协议传输。</text><path d="M44 697H1156" stroke="#d3dce5"/><text x="44" y="729" font-size="17" fill="#52657a">基于仓库代码的流程示意 · 非真机截图 · 不表示新增硬件验证或性能承诺</text></g></svg>
