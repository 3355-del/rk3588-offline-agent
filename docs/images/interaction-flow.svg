<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">文字、图片、语音，如何变成一次回答</title><desc id="desc">交互入口 → 会话编排 → 后端与工具 → 本地输出</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#197d73"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f5f7fa"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" fill="#172c43"><rect x="44" y="40" width="7" height="56" rx="3" fill="#197d73"/><text x="70" y="66" font-size="30" font-weight="700">文字、图片、语音，如何变成一次回答</text><text x="70" y="99" font-size="18" fill="#52657a">交互入口 → 会话编排 → 后端与工具 → 本地输出</text><rect x="44" y="145" width="335" height="135" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="145" width="5" height="135" rx="2" fill="#197d73"/><text x="66" y="183" font-size="24" font-weight="700">文字与图片</text><text x="66" y="218" font-size="19" fill="#52657a">CLI / 本地 GUI</text><text x="66" y="247" font-size="19" fill="#52657a">图片限定目录、格式与大小</text><rect x="821" y="145" width="335" height="135" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="821" y="145" width="5" height="135" rx="2" fill="#197d73"/><text x="843" y="183" font-size="24" font-weight="700">语音输入</text><text x="843" y="218" font-size="19" fill="#52657a">录音 → SenseVoice / Vosk</text><text x="843" y="247" font-size="19" fill="#52657a">识别后进入文字问答</text><path d="M212 280V324H470V355" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M988 280V324H730V355" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="365" y="355" width="470" height="125" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="365" y="355" width="5" height="125" rx="2" fill="#197d73"/><text x="387" y="393" font-size="24" font-weight="700">Agent 会话编排</text><text x="387" y="428" font-size="19" fill="#52657a">上下文裁剪、请求互斥、有限工具调用</text><rect x="44" y="535" width="335" height="120" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="535" width="5" height="120" rx="2" fill="#197d73"/><text x="66" y="573" font-size="24" font-weight="700">后端适配</text><text x="66" y="608" font-size="19" fill="#52657a">RKLLM / RKNN、HTTP 或 mock</text><rect x="433" y="535" width="335" height="120" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="433" y="535" width="5" height="120" rx="2" fill="#197d73"/><text x="455" y="573" font-size="24" font-weight="700">受控工具</text><text x="455" y="608" font-size="19" fill="#52657a">设备状态、告警库、关联截图</text><rect x="821" y="535" width="335" height="120" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="821" y="535" width="5" height="120" rx="2" fill="#197d73"/><text x="843" y="573" font-size="24" font-weight="700">回答与播报</text><text x="843" y="608" font-size="19" fill="#52657a">文字显示；语音经 Piper 合成</text><path d="M430 480V510H212V535" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M600 480V535" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M835 418H988V535" fill="none" stroke="#197d73" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M110 535V418H365" fill="none" stroke="#197d73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="130" y="406" font-size="18" fill="#52657a">后端返回</text><path d="M700 535V480" fill="none" stroke="#197d73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="712" y="510" font-size="18" fill="#52657a">工具结果</text><text x="44" y="689" font-size="18" fill="#52657a">模型和语音组件需自行准备；mock 仅验证流程。</text><path d="M44 697H1156" stroke="#d3dce5"/><text x="44" y="729" font-size="17" fill="#52657a">基于仓库代码的流程示意 · 非真机截图 · 不表示新增硬件验证或性能承诺</text></g></svg>
